buildscript {
	dependencies {
		classpath group: "org.springframework.boot", name: "spring-boot-gradle-plugin", version: "3.3.13"
	}

	repositories {
		maven {
			url "https://repository-cdn.liferay.com/nexus/content/groups/public"
		}
	}
}

apply plugin: "java-library"
apply plugin: "org.springframework.boot"

dependencies {
	implementation group: "com.liferay", name: "com.liferay.client.extension.util.spring.boot3", version: "latest.release"
	implementation group: "com.liferay", name: "org.apache.commons.logging", version: "1.2.LIFERAY-PATCHED-4"
	implementation group: "net.datafaker", name: "datafaker", version: "1.9.0"
	implementation group: "org.json", name: "json", version: "20231013"
	implementation group: "org.springframework.boot", name: "spring-boot-starter-oauth2-resource-server", version: "3.3.13"
	implementation group: "org.springframework.boot", name: "spring-boot-starter-web", version: "3.3.13"
	implementation group: "org.springframework.boot", name: "spring-boot-starter-webflux", version: "3.3.13"

	testImplementation group: "org.springframework.boot", name: "spring-boot-starter-test", version: "3.3.13"
	testRuntimeOnly group: "org.junit.platform", name: "junit-platform-launcher", version: "1.10.5"
}

repositories {
	maven {
		url "https://repository-cdn.liferay.com/nexus/content/groups/public"
	}
}

test {
	useJUnitPlatform()
}
